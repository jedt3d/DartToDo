name: flutter_todo_flutter
description: A local single-user To Do app for macOS, iPhone and iPad.
publish_to: none
version: 1.1.0+2
environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_todo_client:
    path: ../flutter_todo_client
  serverpod_flutter: 3.4.12
  flutter_riverpod: 3.3.1
  widgetbook: 3.23.0
  intl: 0.20.2
  file_picker: 13.4.0
  flutter_local_notifications: 22.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/themes/
