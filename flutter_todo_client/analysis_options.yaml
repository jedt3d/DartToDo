include: package:lints/recommended.yaml

linter:
  rules:
    unawaited_futures: true
    discarded_futures: true
    cancel_subscriptions: true
    close_sinks: true

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - lib/src/protocol/**

formatter:
  trailing_commas: preserve
