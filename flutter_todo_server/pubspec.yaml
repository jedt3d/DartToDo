name: flutter_todo_server
description: Local-only PostgreSQL task service for FlutterToDo.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.8.0'

resolution: workspace

dependencies:
  serverpod: 3.4.12

dev_dependencies:
  flutter_todo_client:
    path: ../flutter_todo_client
  serverpod_cli: 3.4.12
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.12
  test: ^1.25.5

serverpod:
  scripts:
    start: dart bin/main.dart --apply-migrations
